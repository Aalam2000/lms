limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# CSP-отчёты: одна загрузка страницы может дать десятки отчётов, а весь
# класс может сидеть за одним IP — лимит щедрый, но не даёт заспамить таблицу.
limit_req_zone $binary_remote_addr zone=csp_limit:1m rate=120r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name logacademy 192.168.0.9 quiz.logacademy.online;
    client_max_body_size 50m;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'self'; report-uri /api/csp-report;" always;

    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        access_log /var/log/nginx-fail2ban/login.log combined;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Отчёты о нарушениях CSP от браузеров -> backend (таблица csp_reports
    # с дедупликацией). Без access-лога: отчёты идут пачками и уже учтены в БД.
    location = /api/csp-report {
        limit_req zone=csp_limit burst=100 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        access_log off;
        proxy_pass http://backend:8000/csp-report;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /i18n/languages {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/i18n/languages;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /i18n/ {
        proxy_pass http://backend:8000/i18n/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Отчёт NetDiag (проект /opt/netdiag, контейнер netdiag-report, порт 8090
    # хоста). Открыт без проверки (решение Андрея 12.10): ссылка на него есть
    # только в меню админа.
    location = /netdiag { return 301 /netdiag/; }
    location /netdiag/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_set_header Host $host;
        # свой add_header отключает CSP-Report-Only сервера для этого пути:
        # inline-скрипт отчёта иначе засыпал бы таблицу csp_reports
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
