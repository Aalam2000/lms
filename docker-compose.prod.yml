# Имя проекта задано явно (не зависит от имени папки на сервере):
# контейнеры lms-backend-1 и т. д., сеть lms_default.
name: lms

# По умолчанию у docker json-file драйвера НЕТ лимита — лог контейнера
# может расти неограниченно. Общий anchor на все три сервиса: максимум
# 10 МБ на файл, 3 файла на контейнер (ротация) — то есть не больше
# ~30 МБ логов на сервис одновременно.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      # контейнер работает под uid/gid того, кто деплоит (quizadm) —
      # см. scripts/lms.sh и backend/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./translations:/app/translations
      # инструкции (.md): переводы autoi18n кладёт рядом с исходником —
      # том, чтобы они не пропадали при пересборке образа
      - ./backend/templates/help:/app/templates/help
      # методические материалы (.md) — так же, переводы рядом с исходником
      - ./backend/templates/methodology:/app/templates/methodology
      - ./frontend/src:/app/frontend/src:ro
      - ./.env.prod:/app/.env
      # файлы платформы (app/storage.py) — папка сервера, создаётся один раз
      # при установке (DEPLOYMENT.md), lms deploy проверяет её до выкатки
      - /var/lib/logacademy/data:/var/lib/logacademy/data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://192.168.0.9/api
        REACT_APP_PUBLIC_URL: https://quiz.logacademy.online
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend

  nginx:
    # конфиг (deploy/nginx/prod.conf) собран в образ — см. deploy/nginx/Dockerfile
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./logs/nginx-fail2ban:/var/log/nginx-fail2ban
    # отчёт NetDiag (контейнер netdiag-report, порт 8090 хоста) — /netdiag/ в prod.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend

# Сеть закреплена: постоянный интерфейс br-lms и подсеть 172.18.0.0/16.
# К ним привязан доступ backend к PostgreSQL на хосте — правила ufw
# (5433 и 8090 на br-lms) и pg_hba (172.18.0.0/16). Без закрепления Docker
# при пересоздании сети выдаёт новый интерфейс br-<id> и, возможно, другую
# подсеть — и backend перестаёт видеть базу.
networks:
  default:
    name: lms_default
    driver_opts:
      com.docker.network.bridge.name: br-lms
    ipam:
      config:
        - subnet: 172.18.0.0/16
